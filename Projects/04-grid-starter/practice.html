<!doctype html>
<html lang="en-IE">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Week 04 practice</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=Hanken+Grotesk:wght@500;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/app.css" />
  </head>
  <body class="bg-paper font-sans leading-relaxed text-ink">
    <!-- A blank page wired to the same stylesheet as index.html, and to the
         same watcher: any class you type here is built automatically.
         Use it for this week's pattern gallery, challenges and anything you
         want to break on purpose, so index.html keeps matching the guided
         build. -->
    <main>
      <div class="bg-paper grid grid-cols-3 gap-4 px-5 py-5">
          <div class="bg-lime items-center px-4 py-4 text-ink">
            <p>Advisor 1</p>
          </div>
          <div class="bg-pink items-center px-4 py-4 text-ink">
            <p>Advisor 2</p>
          </div>
          <div class="bg-green items-center px-4 py-4 text-ink">
            <p>Advisor 3</p>
          </div>
          <div class="col-span-3 gap-4 bg-ink-deep items-center px-4 py-4 text-on-dark">
            <p>Book and appointment</p>
          </div>
      </div>

      <hr>

      <div class="bg-paper grid grid-cols-5 gap-4 px-5 px-4 items-center">
        <div  class="grid col-span-5 items-center">
          <p>Weekday Planner</p>
        </div>
        <ul class="grid grid-cols-5 col-span-5">
          <li>Monday</li>
          <li>Tuesday</li>
          <li>Wednesday</li>
          <li>Thursday</li>
          <li>Friday</li>
        </ul>
        <div>
          <p>Notes</p>
        </div>
      </div>

    </main>
  </body>
</html>
